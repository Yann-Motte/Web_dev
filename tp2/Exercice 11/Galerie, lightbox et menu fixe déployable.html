<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie d'images</title>
    <link rel="stylesheet" href="styles.css">
    <script src=""></script>
</head>
<body>
    <h1>Galerie d'images</h1>
    <div class="gallery">
        <figure>
            <img src="img/max1.jpg" alt="Scène de véhicules en désert">
            <figcaption>Photo 1</figcaption>
        </figure>
        <figure>
            <img src="img/max2.jpg" alt="Personnage avec un masque">
            <figcaption>Photo 2</figcaption>
        </figure>
        <figure>
            <img src="img/max3.jpg" alt="Véhicule armé dans le désert">
            <figcaption>Photo 3</figcaption>
        </figure>
        <figure>
            <img src="img/max4.jpg" alt="Personnage avec une arme">
            <figcaption>Photo 4</figcaption>
        </figure>
        <figure>
            <img src="img/max5.jpg" alt="Personnage au sol">
            <figcaption>Photo 5</figcaption>
        </figure>
        <figure>
            <img src="img/max6.jpg" alt="Scène avec des structures suspendues">
            <figcaption>Photo 6</figcaption>
        </figure>
        <figure>
            <img src="img/max7.jpg" alt="Personnage féminin en noir et blanc">
            <figcaption>Photo 7</figcaption>
        </figure>
        <figure>
            <img src="img/max8.jpg" alt="Personnage masqué">
            <figcaption>Photo 8</figcaption>
        </figure>
        <figure>
            <img src="img/max9.jpg" alt="Voiture abandonnée dans le désert">
            <figcaption>Photo 9</figcaption>
        </figure>
        <figure>
            <img src="img/max10.jpg" alt="Musicien jouant sur une scène mobile">
            <figcaption>Photo 10</figcaption>
        </figure>
        <figure>
            <img src="img/max11.jpg" alt="Personnage blessé">
            <figcaption>Photo 11</figcaption>
        </figure>
        <figure>
            <img src="img/max12.jpg" alt="Scène d'action avec des véhicules">
            <figcaption>Photo 12</figcaption>
        </figure>
    </div>
    <div class="lightbox" id="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-img" alt="Agrandissement photo">
        <div class="lightbox-caption"></div>
    </div>
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.querySelector('.lightbox-img');
        const lightboxCaption = document.querySelector('.lightbox-caption');
        const closeBtn = document.querySelector('.close');
    
        // Ouvrir la lightbox
        document.querySelectorAll('.gallery img').forEach(img => {
            img.addEventListener('click', (e) => {
                lightbox.classList.add('active');
                lightboxImg.src = e.target.src;
                lightboxCaption.textContent = e.target.parentNode.querySelector('figcaption').textContent;
            });
        });
    
        // Fermer la lightbox
        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });
    
        // Fermer en cliquant en dehors de l'image
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });
    
        // Fermer avec la touche Échap
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
