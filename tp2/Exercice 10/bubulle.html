<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bubulle | Exercice jQuery</title>
	<style>
	body { font-family:Calibri, sans-serif; }
	#nav { position:relative; background-color:#444; z-index: 1;}
	#menu { display:flex; flex-direction:row; position:relative; z-index: 3;}
	#menu a { color:#fff; flex:1; padding:1rem; text-align:center; text-decoration:none; font-size:1.5rem; }
	#bubulle { 
		background-color:#c048; 
		border-radius:8px;
		position:absolute; 
		top:-8px; left:40vw; 
		width:20vw;
		height:4.8rem;
		z-index: 2;
		transition: 600ms;
		opacity: 0;
	}
	
	@media screen and (max-width:560px) { 
		#menu { flex-direction:column; }
		#bubulle {transition: 400ms; width: 100%;}
	}
	</style>
	<script src="jquery.min.js"></script>
</head>
<body>
	<nav id="nav">
		<div id="menu">
			<a href="#">Africa</a>
			<a href="#">America</a>
			<a href="#">Asia</a>
			<a href="#">Europa</a>
			<a href="#">Oceania</a>
		</div>
		<div id="bubulle"></div>
	</nav>
	<script>
		$("#menu a ").hover(function(){
			$("#bubulle").offset({
				left: $(this).offset().left,
				top: $(this).offset().top-8
			})
			$("#bubulle").css("opacity", "100");
		})
		$("#menu").mouseleave(function(){
			$("#bubulle").css("opacity", "0");
		})
	</script>
</body>
</html>
